version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: day-be-hoc-noi-3d:latest
    container_name: day-be-hoc-noi-3d
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=production
      - PORT=80
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:80/healthz').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
